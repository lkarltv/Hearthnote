services:
  hearthnote:
    build: .
    ports:
      - "8000:8000"
    environment:
      NOTES_ROOT: /vault
      CONFIG_PATH: /config/settings.json
    volumes:
      - "${HEARTHNOTE_VAULT_PATH:-./synthetic_data}:/vault:Z"
      - "hearthnote-config:/config"
    restart: unless-stopped

volumes:
  hearthnote-config:

